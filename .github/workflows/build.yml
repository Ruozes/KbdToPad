name: Build

# 推送 v* 标签时自动构建 exe 与安装包并创建草稿 Release；
# 也可以在 Actions 页面手动触发（只上传 artifact，不发 Release）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # 正常一次构建约 6~8 分钟；这里给整条流水线兜底，
    # 避免运行器网络异常时一直挂着（默认上限是 6 小时）。
    timeout-minutes: 45
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # 所有依赖强制走 wheel：vgamepad 在 PyPI 上只有源码包，而它的 setup.py 在构建期
      # 检测到系统没装 ViGEmBus 时，会用 msiexec 启动驱动安装程序 —— 在无人值守的运行器上
      # 会永久阻塞（pip 停在 “Preparing metadata (pyproject.toml)”）。因此改用仓库内预置的
      # third_party/wheels/vgamepad-0.1.0-py3-none-any.whl，并禁止任何依赖现场编译，
      # 缺少 wheel 时立刻报错而不是挂住（详见 third_party/wheels/README.md）。
      - name: 安装依赖
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 30
          pip install --only-binary=:all: --find-links third_party/wheels -r requirements-dev.txt --retries 5 --timeout 30

      - name: 安装 Inno Setup 6
        run: choco install innosetup --no-progress -y

      # build.py 会：生成图标与版本资源 → PyInstaller 打包 → 下载 ViGEmBus/VC++ 运行库 → 编译安装包
      - name: 构建 exe 与安装包
        run: python build.py

      - name: 上传 exe（文件夹版）
        uses: actions/upload-artifact@v4
        with:
          name: KbdToPad-exe
          path: dist/KbdToPad/
          if-no-files-found: error

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: KbdToPad-installer
          path: installer/Output/KbdToPad-Setup-*.exe
          if-no-files-found: warn

      - name: 创建草稿 Release（仅推送 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/KbdToPad-Setup-*.exe
          draft: true
          generate_release_notes: true
