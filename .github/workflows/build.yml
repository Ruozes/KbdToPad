name: Build

# 推送 v* 标签时自动构建 exe 与安装包并创建草稿 Release；
# 也可以在 Actions 页面手动触发（只上传 artifact，不发 Release）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装 Inno Setup 6
        run: choco install innosetup --no-progress -y

      # build.py 会：生成图标与版本资源 → PyInstaller 打包 → 下载 ViGEmBus/VC++ 运行库 → 编译安装包
      - name: 构建 exe 与安装包
        run: python build.py

      - name: 上传 exe（文件夹版）
        uses: actions/upload-artifact@v4
        with:
          name: KbdToPad-exe
          path: dist/KbdToPad/
          if-no-files-found: error

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: KbdToPad-installer
          path: installer/Output/KbdToPad-Setup-*.exe
          if-no-files-found: warn

      - name: 创建草稿 Release（仅推送 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/KbdToPad-Setup-*.exe
          draft: true
          generate_release_notes: true
